<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>
        Gallery | RCCG Trinity Sanctuary
    </title>


    <meta name="description"
        content="Explore moments of worship, fellowship, outreach and community life at RCCG Trinity Sanctuary.">


    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="css/gallery.css">

    <link rel="stylesheet" href="css/responsive.css">


</head>


<body>


    <header class="header" id="header"></header>




    <main>


        <!-- =========================
GALLERY HERO
========================= -->


        <section class="gallery-hero">


            <div class="container">


                <span class="section-tag">
                    Our Gallery
                </span>


                <h1>
                    Moments Of Worship, Faith And Fellowship
                </h1>


                <p>
                    Experience the life of Trinity Sanctuary through pictures
                    of our worship services, events, ministries, and community outreach.
                </p>


            </div>


        </section>







        <!-- =========================
FILTER BUTTONS
========================= -->


        <section class="gallery-section">


            <div class="container">



                <div class="gallery-filter">


                    <button class="active" data-filter="all">

                        All

                    </button>


                    <button data-filter="worship">

                        Worship

                    </button>


                    <button data-filter="events">

                        Events

                    </button>


                    <button data-filter="outreach">

                        Outreach

                    </button>


                    <button data-filter="youth">

                        Youth

                    </button>


                    <button data-filter="children">

                        Children

                    </button>


                </div>






                <!-- =========================
GALLERY GRID
========================= -->


                <div class="gallery-grid">



                    <div class="gallery-item worship">

                        <img src="assets/images/ministries/choir/choir-1.jpeg" alt="Worship">

                    </div>




                    <div class="gallery-item events">

                        <img src="assets/images/services/celebration.jpg" alt="Church Event">

                    </div>




                    <div class="gallery-item children">

                        <img src="assets/images/ministries/children/children-7.jpeg" alt="Children Ministry">

                    </div>




                    <div class="gallery-item worship">

                        <img src="assets/images/ministries/choir/choir-2.jpeg" alt="Praise Worship">

                    </div>




                    <div class="gallery-item youth">

                        <img src="assets/images/ministries/youth/youth-1.jpeg" alt="Youth Ministry">

                    </div>




                    <div class="gallery-item outreach">

                        <img src="assets/images/ministries/outreach/outreach-1.jpeg" alt="Community Outreach">

                    </div>




                    <div class="gallery-item events">

                        <img src="assets/images/services/celebration.jpg" alt="Church Event">

                    </div>




                    <div class="gallery-item outreach">

                        <img src="assets/images/ministries/outreach/outreach-2.jpeg" alt="Outreach">

                    </div>



                </div>


            </div>


        </section>







        <!-- =========================
LIGHTBOX
========================= -->


        <div class="lightbox">


            <span class="close-lightbox">
                ×
            </span>


            <img src="" alt="Gallery Preview">


        </div>




    </main>






    <footer id="footer"></footer>





    <script src="js/navigation.js"></script>

    <script src="js/footer.js"></script>

    <script src="js/gallery-page.js"></script>

    <script src="js/main.js"></script>


</body>


</html>
